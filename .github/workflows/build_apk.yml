name: Build CanonMultiCamPro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Detekt, Unit Tests & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Run Detekt, Unit Tests, and Build Debug APK
        run: ./gradlew detekt testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanonMultiCamPro-v3.0.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Test & Detekt Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CanonMultiCamPro-v3.0.0-reports
          path: |
            app/build/reports/detekt/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
